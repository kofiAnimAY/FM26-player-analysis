<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FM26 Player Analysis</title>
  <style>
    body {
      margin: 0;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0b1120;
      color: #f4f7ff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .container {
      width: min(100%, 980px);
      background: linear-gradient(180deg, rgba(14, 23, 48, 0.98), rgba(10, 16, 35, 0.96));
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;
      box-shadow: 0 32px 80px rgba(0, 0, 0, 0.35);
      padding: 32px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(2rem, 2.6vw, 3rem);
      letter-spacing: -0.04em;
    }

    p.lead {
      margin: 0 0 28px;
      color: #b8c0db;
      line-height: 1.75;
    }

    .form-grid {
      display: grid;
      gap: 18px;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      margin-bottom: 24px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    label {
      font-size: 0.95rem;
      color: #d3d7ef;
    }

    select,
    input,
    button {
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 12px;
      background: rgba(18, 30, 64, 0.9);
      color: #f8fbff;
      padding: 14px 16px;
      font-size: 1rem;
      outline: none;
      transition: all 0.2s ease;
    }

    select:focus,
    button:focus {
      border-color: #6c7bff;
      box-shadow: 0 0 0 4px rgba(108, 123, 255, 0.16);
    }

    button {
      cursor: pointer;
      font-weight: 600;
      letter-spacing: 0.01em;
    }

    .button-row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 8px;
    }

    .button-row button {
      flex: 1;
      min-width: 160px;
      background: #2d3b78;
    }

    .button-row button:hover {
      background: #4351bc;
    }

    .output {
      margin-top: 28px;
      padding: 24px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      min-height: 160px;
      overflow-x: auto;
      white-space: pre-wrap;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      line-height: 1.6;
      color: #e9efff;
    }

    .status {
      margin-top: 14px;
      color: #9fb2ff;
      font-size: 0.95rem;
    }

    .small {
      font-size: 0.9rem;
      color: #9da6d7;
    }

    .tabs {
      display: flex;
      gap: 8px;
      margin: 18px 0;
      flex-wrap: wrap;
    }

    .tab-btn {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.06);
      color: #dce4ff;
      padding: 10px 14px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
    }

    .tab-btn.active {
      background: linear-gradient(90deg,#3a4ad6,#6c7bff);
      border-color: rgba(108,123,255,0.6);
      color: white;
    }

    .manual-groups {
      display: grid;
      gap: 24px;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      margin-top: 16px;
      grid-column: 1 / -1;
    }

    .field.full-width {
      grid-column: 1 / -1;
    }

    .attribute-group {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 18px;
      padding: 18px;
    }

    .attribute-group h3 {
      margin: 0 0 14px;
      font-size: 1rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #eef2ff;
    }

    .attribute-subgroup {
      margin-top: 18px;
    }

    .attribute-subgroup h4 {
      margin: 0 0 12px;
      font-size: 0.95rem;
      letter-spacing: 0.06em;
      color: #b8c0db;
    }

    .attribute-fields {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    @media (max-width: 980px) {
      .manual-groups {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 720px) {
      .manual-groups {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 620px) {
      .button-row {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <main class="container">
    <h1>FM26 Player Analysis</h1>
    <p class="lead">Choose a player, a role and a position category from the dropdown menus. Then run analysis against the backend API without typing raw strings.</p>

    <div class="tabs">
      <button class="tab-btn active" data-tab="analyze">Analyze Role</button>
      <button class="tab-btn" data-tab="best">Player Best Roles</button>
      <button class="tab-btn" data-tab="top">Top Players by Role</button>
      <button class="tab-btn" data-tab="import">Import Players</button>
      <button class="tab-btn" data-tab="manual">Add Player (Manual)</button>
    </div>

    <div class="form-grid">
      <div class="field">
        <label for="playerSelect">Player</label>
        <select id="playerSelect">
          <option value="">Loading players…</option>
        </select>
      </div>

      <div class="field">
        <label for="roleSelect">Role</label>
        <select id="roleSelect">
          <option value="">Select a role</option>
        </select>
      </div>

      <div class="field">
        <label for="positionSelect">Position Category</label>
        <select id="positionSelect">
          <option value="">Select a position category</option>
          <option value="GK">GK</option>
          <option value="DEF">DEF</option>
          <option value="MID">MID</option>
          <option value="ATT">ATT</option>
        </select>
      </div>
      <div class="field">
        <label for="importPath">Import file path</label>
        <input id="importPath" type="text" placeholder="e.g. data/players.rtf" />
      </div>
      <div class="field full-width">
        <label for="manualName">Player Name</label>
        <input id="manualName" type="text" placeholder="e.g. John Smith" />
      </div>

      <div class="manual-groups" id="manualSection">
        <div class="attribute-group">
          <h3>Technical</h3>
          <div class="attribute-fields">
            <div class="field"><label for="attr_crossing">Crossing</label><input id="attr_crossing" type="number" min="0" max="20" /></div>
            <div class="field"><label for="attr_dribbling">Dribbling</label><input id="attr_dribbling" type="number" min="0" max="20" /></div>
            <div class="field"><label for="attr_finishing">Finishing</label><input id="attr_finishing" type="number" min="0" max="20" /></div>
            <div class="field"><label for="attr_first_touch">First touch</label><input id="attr_first_touch" type="number" min="0" max="20" /></div>
            <div class="field"><label for="attr_heading">Heading</label><input id="attr_heading" type="number" min="0" max="20" /></div>
            <div class="field"><label for="attr_long_shots">Long shots</label><input id="attr_long_shots" type="number" min="0" max="20" /></div>
            <div class="field"><label for="attr_marking">Marking</label><input id="attr_marking" type="number" min="0" max="20" /></div>
            <div class="field"><label for="attr_passing">Passing</label><input id="attr_passing" type="number" min="0" max="20" /></div>
            <div class="field"><label for="attr_tackling">Tackling</label><input id="attr_tackling" type="number" min="0" max="20" /></div>
            <div class="field"><label for="attr_technique">Technique</label><input id="attr_technique" type="number" min="0" max="20" /></div>
          </div>
        </div>
        
        
        <div class="attribute-group">
          <h3>Mental</h3>
          <div class="attribute-fields">
            <div class="field"><label for="attr_aggression">Aggression</label><input id="attr_aggression" type="number" min="0" max="20" /></div>
            <div class="field"><label for="attr_anticipation">Anticipation</label><input id="attr_anticipation" type="number" min="0" max="20" /></div>
            <div class="field"><label for="attr_bravery">Bravery</label><input id="attr_bravery" type="number" min="0" max="20" /></div>
            <div class="field"><label for="attr_composure">Composure</label><input id="attr_composure" type="number" min="0" max="20" /></div>
            <div class="field"><label for="attr_concentration">Concentration</label><input id="attr_concentration" type="number" min="0" max="20" /></div>
            <div class="field"><label for="attr_decisions">Decisions</label><input id="attr_decisions" type="number" min="0" max="20" /></div>
            <div class="field"><label for="attr_determination">Determination</label><input id="attr_determination" type="number" min="0" max="20" /></div>
            <div class="field"><label for="attr_flair">Flair</label><input id="attr_flair" type="number" min="0" max="20" /></div>
            <div class="field"><label for="attr_leadership">Leadership</label><input id="attr_leadership" type="number" min="0" max="20" /></div>
            <div class="field"><label for="attr_off_the_ball">Off the Ball</label><input id="attr_off_the_ball" type="number" min="0" max="20" /></div>
            <div class="field"><label for="attr_positioning">Positioning</label><input id="attr_positioning" type="number" min="0" max="20" /></div>
            <div class="field"><label for="attr_teamwork">Teamwork</label><input id="attr_teamwork" type="number" min="0" max="20" /></div>
            <div class="field"><label for="attr_vision">Vision</label><input id="attr_vision" type="number" min="0" max="20" /></div>
            <div class="field"><label for="attr_work_rate">Work Rate</label><input id="attr_work_rate" type="number" min="0" max="20" /></div>
          </div>
        </div>
        <div class="attribute-group">
          <h3>Physical</h3>
          <div class="attribute-fields">
            <div class="field"><label for="attr_acceleration">Acceleration</label><input id="attr_acceleration" type="number" min="0" max="20" /></div>
            <div class="field"><label for="attr_agility">Agility</label><input id="attr_agility" type="number" min="0" max="20" /></div>
            <div class="field"><label for="attr_balance">Balance</label><input id="attr_balance" type="number" min="0" max="20" /></div>
            <div class="field"><label for="attr_jumping_reach">Jumping Reach</label><input id="attr_jumping_reach" type="number" min="0" max="20" /></div>
            <div class="field"><label for="attr_natural_fitness">Natural Fitness</label><input id="attr_natural_fitness" type="number" min="0" max="20" /></div>
            <div class="field"><label for="attr_pace">Pace</label><input id="attr_pace" type="number" min="0" max="20" /></div>
            <div class="field"><label for="attr_stamina">Stamina</label><input id="attr_stamina" type="number" min="0" max="20" /></div>
            <div class="field"><label for="attr_strength">Strength</label><input id="attr_strength" type="number" min="0" max="20" /></div>
          </div>
          
        </div>
        <div class="attribute-group">
          <h3>Set Pieces</h3>
          <div class="attribute-fields">
            <div class="field"><label for="attr_corners">Corners</label><input id="attr_corners" type="number" min="0" max="20" /></div>
            <div class="field"><label for="attr_free_kick_taking">Free Kick Taking</label><input id="attr_free_kick_taking" type="number" min="0" max="20" /></div>
            <div class="field"><label for="attr_long_throws">Long throws</label><input id="attr_long_throws" type="number" min="0" max="20" /></div>
            <div class="field"><label for="attr_penalty_taking">Penalty taking</label><input id="attr_penalty_taking" type="number" min="0" max="20" /></div>
          </div>
        </div>
        <div class="attribute-group">
            <h3>Goalkeeping</h3>
            <div class="attribute-fields">
              <div class="field"><label for="attr_aerial_reach">Aerial Reach</label><input id="attr_aerial_reach" type="number" min="0" max="20" /></div>
              <div class="field"><label for="attr_command_of_area">Command of Area</label><input id="attr_command_of_area" type="number" min="0" max="20" /></div>
              <div class="field"><label for="attr_communication">Communication</label><input id="attr_communication" type="number" min="0" max="20" /></div>
              <div class="field"><label for="attr_eccentricity">Eccentricity</label><input id="attr_eccentricity" type="number" min="0" max="20" /></div>
              <div class="field"><label for="attr_handling">Handling</label><input id="attr_handling" type="number" min="0" max="20" /></div>
              <div class="field"><label for="attr_kicking">Kicking</label><input id="attr_kicking" type="number" min="0" max="20" /></div>
              <div class="field"><label for="attr_one_on_ones">One on Ones</label><input id="attr_one_on_ones" type="number" min="0" max="20" /></div>
              <div class="field"><label for="attr_punching_tendency">Punching Tendency</label><input id="attr_punching_tendency" type="number" min="0" max="20" /></div>
              <div class="field"><label for="attr_reflexes">Reflexes</label><input id="attr_reflexes" type="number" min="0" max="20" /></div>
              <div class="field"><label for="attr_rushing_out_tendency">Rushing Out Tendency</label><input id="attr_rushing_out_tendency" type="number" min="0" max="20" /></div>
              <div class="field"><label for="attr_throwing">Throwing</label><input id="attr_throwing" type="number" min="0" max="20" /></div>
            </div>
          </div>
      </div>
    </div>

    <div class="button-row">
      <button id="analyzeRoleBtn" type="button">Analyze Selected Role</button>
      <button id="bestRolesBtn" type="button">View Best Roles</button>
      <button id="allForRoleBtn" type="button">Top Players for Role</button>
      <button id="importBtn" type="button">Import Players</button>
      <button id="addPlayerBtn" type="button">Add Player</button>
    </div>

    <div class="status" id="statusMessage">Ready.</div>
    <div class="output" id="resultOutput">Select a player and role to begin.</div>
  </main>

  <script>
    const playerSelect = document.getElementById('playerSelect');
    const roleSelect = document.getElementById('roleSelect');
    const positionSelect = document.getElementById('positionSelect');
    const analyzeRoleBtn = document.getElementById('analyzeRoleBtn');
    const bestRolesBtn = document.getElementById('bestRolesBtn');
    const allForRoleBtn = document.getElementById('allForRoleBtn');
    const resultOutput = document.getElementById('resultOutput');
    const statusMessage = document.getElementById('statusMessage');
    const API_BASE = 'http://localhost:8000';

    const importPathInput = document.getElementById('importPath');
    const importBtn = document.getElementById('importBtn');
    const manualName = document.getElementById('manualName');
    const addPlayerBtn = document.getElementById('addPlayerBtn');
    const manualSection = document.getElementById('manualSection');

    // Tab logic: map tabs to visible field IDs and buttons
    const tabs = Array.from(document.querySelectorAll('.tab-btn'));
    const manualAttributes = [
      'crossing','dribbling','finishing','first_touch','free_kick_taking','heading','long_shots','long_throws','marking','passing','penalty_taking','tackling','technique','corners','aggression','anticipation','bravery','composure','concentration','decisions','determination','flair','leadership','off_the_ball','positioning','teamwork','vision','work_rate','adaptability','ambition','acceleration','agility','balance','jumping_reach','natural_fitness','pace','stamina','strength','aerial_reach','command_of_area','communication','eccentricity','handling','kicking','one_on_ones','punching_tendency','reflexes','rushing_out_tendency','throwing'
    ];

    const basicFields = ['playerSelect','roleSelect','positionSelect','importPath','manualName'];
    const fieldIds = basicFields.concat(manualAttributes.map(a => 'attr_' + a));
    const buttonIds = ['analyzeRoleBtn','bestRolesBtn','allForRoleBtn','importBtn','addPlayerBtn'];

    const tabMap = {
      analyze: { fields: ['playerSelect','roleSelect'], buttons: ['analyzeRoleBtn'] },
      best: { fields: ['playerSelect','positionSelect'], buttons: ['bestRolesBtn'] },
      top: { fields: ['roleSelect'], buttons: ['allForRoleBtn'] },
      import: { fields: ['importPath'], buttons: ['importBtn'] },
      manual: { fields: ['manualName'].concat(manualAttributes.map(a => 'attr_' + a)), buttons: ['addPlayerBtn'] }
    };

    function hideAll() {
      // hide field containers
      fieldIds.forEach(id => {
        const el = document.getElementById(id);
        if (el && el.parentElement) el.parentElement.style.display = 'none';
      });
      // hide buttons
      buttonIds.forEach(id => {
        const el = document.getElementById(id);
        if (el) el.style.display = 'none';
      });
    }

    function showTab(name) {
      hideAll();
      if (manualSection) {
        manualSection.style.display = name === 'manual' ? '' : 'none';
      }
      const map = tabMap[name];
      if (!map) return;
      map.fields.forEach(id => {
        const el = document.getElementById(id);
        if (el && el.parentElement) el.parentElement.style.display = '';
      });
      map.buttons.forEach(id => {
        const el = document.getElementById(id);
        if (el) el.style.display = '';
      });
      tabs.forEach(t => t.classList.toggle('active', t.dataset.tab === name));
    }

    tabs.forEach(t => t.addEventListener('click', () => showTab(t.dataset.tab)));

    const roles = [
      'GoalKeeper',
      'SweeperKeeper',
      'BallPlayingDef',
      'CenterBack',
      'WingBack',
      'DeepLyingPlaymaker',
      'BallWinningMid',
      'BoxToBox',
      'AdvancedPlaymaker',
      'ShadowStriker',
      'InsideForward',
      'Winger',
      'AdvancedForward',
      'DeepLyingForward',
      'TargetForward'
    ];

    function setStatus(message, isError = false) {
      statusMessage.textContent = message;
      statusMessage.style.color = isError ? '#ff8a8a' : '#9fb2ff';
    }

    function setResult(content) {
      resultOutput.textContent = typeof content === 'string' ? content : JSON.stringify(content, null, 2);
    }

    async function fetchPlayers() {
      try {
        setStatus('Loading players...');
        const response = await fetch(`${API_BASE}/players/list`);
        if (!response.ok) {
          throw new Error(`Server returned ${response.status}`);
        }
        const players = await response.json();
        playerSelect.innerHTML = '<option value="">Choose a player</option>';
        players.sort((a, b) => a.name.localeCompare(b.name)).forEach(player => {
          const option = document.createElement('option');
          option.value = player.name;
          option.textContent = player.name;
          playerSelect.appendChild(option);
        });
        setStatus('Players loaded. Choose a player and role.');
      } catch (error) {
        playerSelect.innerHTML = '<option value="">Failed to load players</option>';
        setStatus('Unable to load players. Check backend availability.', true);
        setResult(error.message);
      }
    }

    function populateRoleOptions() {
      roleSelect.innerHTML = '<option value="">Choose a role</option>';
      roles.forEach(role => {
        const option = document.createElement('option');
        option.value = role;
        option.textContent = role;
        roleSelect.appendChild(option);
      });
    }

    async function postJson(url, body) {
      const response = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      if (!response.ok) {
        const errorText = await response.text();
        throw new Error(`Request failed: ${response.status} ${errorText}`);
      }
      return response.json();
    }

    async function importPlayers() {
      const path = importPathInput.value && importPathInput.value.trim();
      if (!path) {
        setStatus('Enter a file path to import.', true);
        return;
      }
      try {
        setStatus('Importing players...');
        setResult('Working…');
        const result = await postJson(`${API_BASE}/players/import`, { path });
        setStatus('Import complete. Refreshing players.');
        setResult(result);
        await fetchPlayers();
      } catch (error) {
        setStatus('Error importing players. See output.', true);
        setResult(error.message);
      }
    }

    async function addPlayer() {
      const name = manualName.value && manualName.value.trim();
      if (!name) {
        setStatus('Enter a player name.', true);
        return;
      }

      const payload = { name };
      // collect numeric attributes limited to 0-20
      manualAttributes.forEach(attr => {
        const el = document.getElementById('attr_' + attr);
        if (el && el.value !== '') {
          const val = Number(el.value);
          payload[attr] = val;
        }
      });

      try {
        setStatus('Adding player...');
        setResult('Working…');
        const result = await postJson(`${API_BASE}/players/create`, payload);
        setStatus('Player added. Refreshing players.');
        setResult(result);
        // Clear form
        manualName.value = '';
        manualAttributes.forEach(attr => {
          const el = document.getElementById('attr_' + attr);
          if (el) el.value = '';
        });
        await fetchPlayers();
      } catch (error) {
        setStatus('Error adding player. See output.', true);
        setResult(error.message);
      }
    }

    analyzeRoleBtn.addEventListener('click', async () => {
      const playerName = playerSelect.value;
      const role = roleSelect.value;
      if (!playerName || !role) {
        setStatus('Pick both a player and a role before analyzing.', true);
        return;
      }
      try {
        setStatus('Analyzing player role...');
        setResult('Loading…');
        const result = await postJson(`${API_BASE}/players/analyse/${encodeURIComponent(playerName)}`, { role });
        setStatus('Analysis complete.');
        setResult(result);
      } catch (error) {
        setStatus('Error analyzing role. See output for details.', true);
        setResult(error.message);
      }
    });

    bestRolesBtn.addEventListener('click', async () => {
      const playerName = playerSelect.value;
      const category = positionSelect.value;
      if (!playerName) {
        setStatus('Select a player first.', true);
        return;
      }
      try {
        setStatus('Fetching best roles...');
        setResult('Loading…');
        const payload = category ? { category } : {};
        const result = await postJson(`${API_BASE}/players/analyse/${encodeURIComponent(playerName)}/best`, payload);
        setStatus('Best roles loaded.');
        setResult(result);
      } catch (error) {
        setStatus('Error loading best roles.', true);
        setResult(error.message);
      }
    });

    importBtn.addEventListener('click', importPlayers);
    addPlayerBtn.addEventListener('click', addPlayer);

    allForRoleBtn.addEventListener('click', async () => {
      const role = roleSelect.value;
      if (!role) {
        setStatus('Select a role first.', true);
        return;
      }
      try {
        setStatus('Fetching top players for role...');
        setResult('Loading…');
        const result = await postJson(`${API_BASE}/players/analyse/role`, { role });
        setStatus('Top players for selected role loaded.');
        setResult(result);
      } catch (error) {
        setStatus('Error fetching role leaderboard.', true);
        setResult(error.message);
      }
    });

    window.addEventListener('load', async () => {
      populateRoleOptions();
      await fetchPlayers();
      showTab('analyze');
    });
  </script>
</body>
</html>
